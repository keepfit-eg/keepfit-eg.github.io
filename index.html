<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>Keep Fit</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#C2410C">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Readex+Pro:wght@500;700&display=swap">
<style>
/* Layout: section rail on the right (RTL) + working area; on phones the rail becomes a sticky scrolling tab strip */
:root{
  --bg:#F2F3F0; --surface:#FFFFFF; --sunk:#E9EBE6; --ink:#18201C; --muted:#56605A; --line:#D7DBD4;
  --accent:#C2410C; --accent-ink:#FFFFFF; --accent-soft:#FBE6DA;
  --ok:#1D7048; --ok-soft:#DDF0E5; --warn:#8A5300; --warn-soft:#F8EBCF; --bad:#B42318; --bad-soft:#FBE1DE;
  --f-display:"Readex Pro","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --f-body:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111513; --surface:#191F1C; --sunk:#222924; --ink:#E8EDE9; --muted:#9DA8A1; --line:#2E3732;
  --accent:#FF8148; --accent-ink:#1B0C04; --accent-soft:#3A2015;
  --ok:#62C995; --ok-soft:#16301F; --warn:#F2B84F; --warn-soft:#33270E; --bad:#FF8073; --bad-soft:#3A1916; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111513; --surface:#191F1C; --sunk:#222924; --ink:#E8EDE9; --muted:#9DA8A1; --line:#2E3732;
  --accent:#FF8148; --accent-ink:#1B0C04; --accent-soft:#3A2015;
  --ok:#62C995; --ok-soft:#16301F; --warn:#F2B84F; --warn-soft:#33270E; --bad:#FF8073; --bad-soft:#3A1916; color-scheme:dark}
html,body{height:100%}
body{margin:0;-webkit-text-size-adjust:100%}
.loading{min-height:100%;display:grid;place-items:center;color:var(--muted);font-size:16px}
.netbar{position:fixed;top:0;left:0;right:0;z-index:70;background:var(--warn-soft);color:var(--ink);text-align:center;font-size:13px;padding:6px 16px calc(6px);padding-top:calc(6px + env(safe-area-inset-top,0px))}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55}
*{box-sizing:border-box}
[hidden]{display:none!important}
h1,h2,h3{font-family:var(--f-display);font-weight:700;margin:0;text-wrap:balance;line-height:1.3}
h1{font-size:24px} h2{font-size:18px} h3{font-size:16px}
.muted{color:var(--muted)} .num{font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
.rail{background:var(--surface);border-inline-end:1px solid var(--line);display:flex;flex-direction:column;gap:4px;padding:20px 14px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 16px}
.logo{width:36px;height:36px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:15px;letter-spacing:.5px;flex:none}
.brand b{font-family:var(--f-display);font-size:18px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{all:unset;cursor:pointer;padding:9px 12px;border-radius:8px;font-weight:500;color:var(--muted);white-space:nowrap}
.nav button:hover{background:var(--sunk);color:var(--ink)}
.nav button.on{background:var(--accent-soft);color:var(--ink);font-weight:600}
.nav button:focus-visible{outline:2px solid var(--accent)}
.me{margin-top:auto;border-top:1px solid var(--line);padding:14px 8px 0;display:flex;flex-direction:column;gap:6px;font-size:13px}
.me b{font-size:14px}
.main{padding-block:24px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-width:0}
.wrap{max-width:1100px;margin-inline:auto;display:flex;flex-direction:column;gap:18px}

@media (max-width:860px){
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
  .app{grid-template-columns:1fr}
  .rail{position:sticky;top:env(safe-area-inset-top,0px);height:auto;flex-direction:row;align-items:center;z-index:6;border-inline-end:0;border-bottom:1px solid var(--line);padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));overflow-x:auto}
  .brand{padding:0 0 0 6px}.brand b{display:none}
  .nav{flex-direction:row}
  .me{margin:0;border:0;padding:0;flex-direction:row;align-items:center}
  .me .who{display:none}
}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:600;white-space:nowrap}
.btn:hover{background:var(--sunk)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:var(--bad);border-color:var(--bad-soft)}
.btn.danger:hover{background:var(--bad-soft)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{padding:4px 10px;font-size:13px;font-weight:500}
.btn.big{padding:12px 20px;font-size:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.between{justify-content:space-between}
.spacer{flex:1}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.cards2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:18px}
@media (max-width:420px){.cards2{grid-template-columns:1fr}}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.stat span{font-size:13px;color:var(--muted)}
.stat b{font-family:var(--f-display);font-size:26px;font-variant-numeric:tabular-nums}
.stat small{font-size:12px;color:var(--muted)}
.stat.good b{color:var(--ok)} .stat.bad b{color:var(--bad)}

.search-hero{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:26px 20px;display:flex;flex-direction:column;gap:10px;align-items:stretch}
.search-hero h1{font-size:28px}
.search{display:flex;gap:8px}
.search input{flex:1;min-width:0;font-size:20px;padding:12px 14px;border:2px solid var(--line);border-radius:10px;background:var(--bg);font-variant-numeric:tabular-nums}
.search input:focus{border-color:var(--accent);outline:none}
.results{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.results:empty{display:none}
.res{all:unset;cursor:pointer;display:flex;gap:12px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--surface)}
.res:last-child{border-bottom:0}
.res:hover,.res:focus-visible{background:var(--sunk)}
.res .code{font-family:var(--f-display);font-weight:700;min-width:56px;font-variant-numeric:tabular-nums}

.tblbox{display:flex;flex-direction:column;gap:8px;min-width:0}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{width:100%;border-collapse:collapse}
th,td{padding:9px 12px;text-align:start;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:middle}
tr:last-child td{border-bottom:0}
th{font-size:12.5px;color:var(--muted);font-weight:600;background:var(--sunk)}
td.num,th.num{font-variant-numeric:tabular-nums}
tr.click{cursor:pointer} tr.click:hover td{background:var(--sunk)}
tfoot td{font-weight:700;background:var(--sunk)}
.empty{padding:22px;text-align:center;color:var(--muted)}
.bar{height:8px;border-radius:4px;background:var(--sunk);min-width:80px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:4px}

.chip{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12.5px;font-weight:600;background:var(--sunk);color:var(--muted)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.acc{background:var(--accent-soft);color:var(--ink)}

.mcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;display:grid;grid-template-columns:auto 1fr;gap:0;overflow:hidden}
.mcode{background:var(--ink);color:var(--bg);padding:16px 22px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:2px;min-width:120px}
.mcode span{font-size:12px;letter-spacing:.6px;opacity:.75}
.mcode b{font-family:var(--f-display);font-size:30px;font-variant-numeric:tabular-nums}
.minfo{padding:14px 18px;display:flex;flex-direction:column;gap:8px;min-width:0}
@media (max-width:520px){.mcard{grid-template-columns:1fr}.mcode{flex-direction:row;justify-content:flex-start;gap:10px;padding:10px 16px}.mcode b{font-size:22px}}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kv div{display:flex;flex-direction:column;background:var(--sunk);border-radius:8px;padding:8px 12px;min-width:0}
.kv span{font-size:12px;color:var(--muted)}
.kv b{font-weight:600;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.kv b.bad{color:var(--bad)} .kv b.ok{color:var(--ok)}

.banner{background:var(--warn-soft);color:var(--ink);border-radius:var(--r);padding:10px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:14px}
.banner.info{background:var(--accent-soft)}

.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);font-weight:500;min-width:0}
.f.wide{grid-column:1/-1}
.f input,.f select,.f textarea,input.in,select.in{padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font-size:15px;min-width:0;width:100%}
.f input[readonly]{background:var(--sunk)}
.pair{display:flex;gap:6px}.pair>*{flex:1}
.check{display:flex;gap:8px;align-items:center;color:var(--ink);font-size:14px;cursor:pointer}
.check input{width:18px;height:18px;accent-color:var(--accent)}
textarea{min-height:140px;font-family:ui-monospace,Consolas,monospace;font-size:12px}

.modal{position:fixed;inset:0;background:rgb(0 0 0 / .5);display:flex;align-items:flex-start;justify-content:center;overflow:auto;z-index:50;padding-block:max(16px,env(safe-area-inset-top,0px)) 16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sheet{background:var(--surface);border-radius:14px;width:min(660px,100%);padding:18px;margin-block:4vh;display:flex;flex-direction:column;gap:14px;border:1px solid var(--line)}
.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:10px}
.x{all:unset;cursor:pointer;font-size:24px;line-height:1;padding:2px 8px;border-radius:6px;color:var(--muted)}
.x:hover{background:var(--sunk)}
.form-end{display:flex;gap:8px;justify-content:flex-start;margin-top:6px}
.err{color:var(--bad);font-size:14px;min-height:1em}

.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:10px;z-index:60;font-weight:500;max-width:calc(100% - 32px);box-shadow:0 6px 20px rgb(0 0 0 / .2)}

.login{min-height:100%;display:grid;place-items:center;padding-block:24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.login .card{width:min(400px,100%);padding:26px;gap:14px}
.login .logo{width:52px;height:52px;font-size:20px;border-radius:12px}
.demo{font-size:13px;background:var(--sunk);border-radius:8px;padding:10px 12px;display:grid;grid-template-columns:auto auto;gap:2px 14px;color:var(--muted)}
.demo b{color:var(--ink);font-weight:600;font-family:ui-monospace,Consolas,monospace}

.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{all:unset;cursor:pointer;padding:6px 14px;border-radius:99px;border:1px solid var(--line);font-weight:500;background:var(--surface)}
.tabs button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tabs button.on .muted{color:inherit;opacity:.7}
.tabs button:focus-visible{outline:2px solid var(--accent)}
.matrix td{text-align:center}.matrix td:first-child,.matrix th:first-child{text-align:start}
.matrix input{width:18px;height:18px;accent-color:var(--accent);cursor:pointer}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips .chip{display:inline-flex;align-items:center;gap:6px;font-size:14px;padding:4px 6px 4px 12px;color:var(--ink)}
.chips .chip button{all:unset;cursor:pointer;color:var(--muted);padding:0 4px;border-radius:4px}
.chips .chip button:hover{color:var(--bad)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>


<div id="root" dir="rtl" lang="ar"></div>
<div id="modal" class="modal" dir="rtl" hidden><div class="sheet" role="dialog" aria-modal="true"><div class="sheet-h"><h2 id="mTitle"></h2><button class="x" onclick="closeModal()" aria-label="إغلاق">×</button></div><div id="mBody"></div></div></div>
<div id="toast" class="toast" dir="rtl" hidden></div>

<script>
/* ============ ثوابت الصلاحيات ============ */
const MODULES=[
  {key:'home',name:'إحصائيات الصفحة الرئيسية',acts:['view']},
  {key:'members',name:'المشتركين',acts:['view','add','edit','delete']},
  {key:'subs',name:'الاشتراكات',acts:['view','add','edit','delete']},
  {key:'subs_custom',name:'تغيير مدة وسعر وحصص الاشتراك يدوي (بدل الباقة)',acts:['edit']},
  {key:'payments',name:'الدفعات',acts:['view','add','delete']},
  {key:'money',name:'رؤية المبالغ المالية',acts:['view']},
  {key:'attendance',name:'الحضور',acts:['view','add','delete']},
  {key:'expenses',name:'المصاريف',acts:['view','add','edit','delete']},
  {key:'rep_mem',name:'تقرير المشتركين',acts:['view']},
  {key:'rep_daily',name:'التقرير المالي اليومي',acts:['view']},
  {key:'rep_exp',name:'تقرير المصاريف',acts:['view']},
  {key:'rep_admin',name:'تقارير الإدارة',acts:['view']},
  {key:'partners',name:'جاري الشركاء (المسحوبات)',acts:['view','add','edit','delete']},
  {key:'adjust',name:'إيرادات ومصروفات إدارية (برا اليومية)',acts:['view','add','edit','delete']},
  {key:'settings',name:'الإعدادات (الباقات والكباتن والأنواع)',acts:['view','edit']},
  {key:'users',name:'المستخدمين والصلاحيات',acts:['view','edit']},
  {key:'audit',name:'سجل الحركات',acts:['view']},
];
const ACTS={view:'يشوف',add:'يضيف',edit:'يعدّل',delete:'يمسح'};
const METHODS=['كاش','إنستاباي'];
const NAV=[
  {v:'home',label:'الرئيسية'},
  {v:'members',label:'المشتركين',mod:['members']},
  {v:'expenses',label:'المصاريف',mod:['expenses']},
  {v:'reports',label:'التقارير',mod:['rep_mem','rep_daily','rep_exp','rep_admin']},
  {v:'partners',label:'الشركاء',mod:['partners']},
  {v:'settings',label:'الإعدادات',mod:['settings']},
  {v:'users',label:'المستخدمين والصلاحيات',mod:['users']},
  {v:'audit',label:'سجل الحركات',mod:['audit']},
];
let DB, ME=null, VIEW='home', ARG=null;
const F={mf:'',mt:'',d1:'',d2:'',pf:'',pt:'',pp:'',mq:'',ms:'all',em:'',ec:'',rm:'',au:'',aq:'',role:'manager',rt:'fin'};

/* ============ أدوات ============ */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sum=a=>a.reduce((x,y)=>x+(+y||0),0);
const fmt=n=>Math.round(+n||0).toLocaleString('en-US');
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today=()=>ymd(new Date());
const thisMonth=()=>today().slice(0,7);
const parseD=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(s,n)=>{const d=parseD(s);d.setDate(d.getDate()+n);return ymd(d)};
const addMonths=(s,n)=>{const d=parseD(s);const day=d.getDate();d.setDate(1);d.setMonth(d.getMonth()+n);const last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();d.setDate(Math.min(day,last));return ymd(d)};
const dBetween=(a,b)=>Math.round((parseD(b)-parseD(a))/864e5);
const dshow=s=>s?s.split('-').reverse().join('/'):'—';
const nowTime=()=>{const d=new Date();return pad(d.getHours())+':'+pad(d.getMinutes())};
const uid=()=>Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-5);
const endOf=(start,len,unit)=>unit==='d'?addDays(start,Math.max(1,+len)-1):addDays(addMonths(start,Math.max(1,+len)),-1);
const MONTHS=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
const monthName=m=>{const [y,mm]=m.split('-');return MONTHS[+mm-1]+' '+y};

/* ============ التخزين ============ */
function migrate(){
  upgradeRoles();
  // إصلاح وحدة المدة اللي اتحفظت غلط في النسخة الأولى
  DB.subs.forEach(s=>{if(String(s.unit).includes(',')){s.unit=String(s.unit).split(',')[0];s.end=endOf(s.start,s.len,s.unit);}});
  DB.plans.forEach(p=>{if(String(p.unit).includes(',')) p.unit=String(p.unit).split(',')[0];});
  DB.payments.forEach(p=>{if(p.method==='فودافون كاش') p.method='إنستاباي';});
  if(!DB.partners) DB.partners=[]; if(!DB.withdrawals) DB.withdrawals=[]; if(!DB.audit) DB.audit=[]; if(!DB.adjustments) DB.adjustments=[];
  DB.partners=DB.partners.map(p=>typeof p==='string'?{id:uid(),name:p,phone:'',share:'',note:''}:p);
  DB.withdrawals.forEach(w=>{if(!w.partnerId&&w.partner){let p=DB.partners.find(x=>x.name===w.partner);if(!p){p={id:uid(),name:w.partner,phone:'',share:'',note:''};DB.partners.push(p)}w.partnerId=p.id;delete w.partner;}});
  DB.roles.forEach(r=>{if(r.perms.rep_fin){delete r.perms.rep_fin;r.perms.rep_daily=['view'];r.perms.rep_admin=['view'];r.perms.partners=['view','add'];}});
  const adm=DB.roles.find(r=>r.id==='admin'); if(adm) MODULES.forEach(m=>adm.perms[m.key]=[...m.acts]);
  
}
/* ---- مزامنة Firebase ---- */
const COLS=['members','subs','payments','attendance','expenses','withdrawals','adjustments','audit'];
const CFG_KEYS=['settings','roles','plans','trainers','activities','expenseCats','partners','demo'];
let SYNC={}, CFG_SYNC={}, SHARDS={}, STATE='loading', AUTH_MSG='', PENDING_RENDER=false, USERS_ALL=[];
COLS.forEach(c=>SYNC[c]=new Map());
function hash(s){let h=0;for(const c of String(s))h=(h*31+c.charCodeAt(0))|0;return Math.abs(h)}
function shardOf(col,o){
  switch(col){
    case 'members': return 'members_'+(hash(o.id)%4);
    case 'subs': return 'subs_'+String(o.start||'0000').slice(0,4);
    case 'adjustments': case 'withdrawals': return col+'_'+String(o.date||'0000').slice(0,4);
    case 'audit': {const d=String(o.at||'0000-00-00').slice(0,10);return 'audit_'+d.slice(0,7)+(+d.slice(8,10)<=15?'a':'b');}
    default: return col+'_'+String(o.date||'0000-00').slice(0,7);
  }
}
function emptyDB(gymName){
  const d=seed(); Object.assign(d,{demo:false,users:[],trainers:[],partners:[],members:[],subs:[],payments:[],attendance:[],expenses:[],withdrawals:[],adjustments:[],audit:[]});
  d.plans=d.plans.filter(p=>!p.activity); d.settings.nextCode=1001; if(gymName) d.settings.gymName=gymName; return d;
}
function cfgOf(d){const o={};CFG_KEYS.forEach(k=>o[k]=d[k]??null);return o}
DB=emptyDB();
function applyConfig(cfg){
  if(!cfg) return;
  CFG_KEYS.forEach(k=>{ if(k in cfg){ DB[k]=cfg[k]; CFG_SYNC[k]=JSON.stringify(cfg[k]??null); } });
}
function applyShards(changes){
  for(const c of changes){ if(c.items==null) delete SHARDS[c.id]; else SHARDS[c.id]=c.items; }
  const fresh={}; COLS.forEach(c=>{fresh[c]=[];SYNC[c]=new Map()});
  for(const [docId,items] of Object.entries(SHARDS)){
    const col=docId.slice(0,docId.indexOf('_')); if(!fresh[col]) continue;
    for(const [id,json] of Object.entries(items||{})){ try{fresh[col].push(JSON.parse(json));SYNC[col].set(id,{json,shard:docId})}catch(e){} }
  }
  COLS.forEach(c=>{
    const old=new Map((DB[c]||[]).map(o=>[o.id,o]));
    DB[c]=fresh[c].map(n=>{const o=old.get(n.id);if(!o) return n;Object.keys(o).forEach(k=>{if(!(k in n)) delete o[k]});return Object.assign(o,n)});
  });
  DB.audit.sort((a,b)=>String(b.at).localeCompare(String(a.at)));
}
function save(){
  if(!window.FB||!FB.ready()) return;
  const sets={}, dels={};
  for(const c of COLS){
    const seen=new Set();
    for(const o of DB[c]){
      if(!o.id) o.id=uid(); seen.add(o.id);
      const json=JSON.stringify(o), sh=shardOf(c,o), prev=SYNC[c].get(o.id);
      if(prev&&prev.json===json&&prev.shard===sh) continue;
      (sets[sh]=sets[sh]||{})[o.id]=json;
      if(prev&&prev.shard!==sh) (dels[prev.shard]=dels[prev.shard]||[]).push(o.id);
      SYNC[c].set(o.id,{json,shard:sh});
    }
    for(const [id,p] of [...SYNC[c]]) if(!seen.has(id)){(dels[p.shard]=dels[p.shard]||[]).push(id);SYNC[c].delete(id);}
  }
  const cfg={};
  for(const k of CFG_KEYS){const j=JSON.stringify(DB[k]??null);if(CFG_SYNC[k]!==j){cfg[k]=DB[k]??null;CFG_SYNC[k]=j}}
  if(Object.keys(sets).length||Object.keys(dels).length||Object.keys(cfg).length) FB.write(sets,dels,cfg);
}

function upgradeRoles(){let ch=false;(DB.roles||[]).forEach(r=>{if(r.perms&&r.perms.rep_admin&&!r.perms.rep_exp){r.perms.rep_exp=['view'];ch=true}});return ch}

function can(mod,act='view'){ if(!ME) return false; const r=role(); if(r.id==='admin') return true; return (r.perms[mod]||[]).includes(act); }

/* ============ حسابات ============ */
const trainerName=id=>DB.trainers.find(x=>x.id===id)?.name||'—';
const memberById=id=>DB.members.find(m=>m.id===id);
const memberSubs=mid=>DB.subs.filter(s=>s.memberId===mid).sort((a,b)=>b.start.localeCompare(a.start));
const subPaid=sid=>sum(DB.payments.filter(p=>p.subId===sid).map(p=>p.amount));
const subLeft=s=>Math.max(0,(+s.total||0)-subPaid(s.id));
const memberBalance=mid=>sum(memberSubs(mid).map(subLeft));
function currentSub(mid){const t=today(),subs=memberSubs(mid);return subs.find(s=>s.start<=t&&s.end>=t)||subs.find(s=>s.start>t)||subs[0]||null}
function subWinEnd(s){const nx=DB.subs.filter(x=>x.memberId===s.memberId&&x.id!==s.id&&x.start>s.start).map(x=>x.start).sort()[0];return nx&&addDays(nx,-1)<s.end?addDays(nx,-1):s.end}
function subUsed(s){if(!s) return 0;const we=subWinEnd(s);return (+s.usedBefore||0)+DB.attendance.filter(a=>a.memberId===s.memberId&&a.date>=s.start&&a.date<=we).length}
function subSessLeft(s){return s&&+s.sessions>0?Math.max(0,+s.sessions-subUsed(s)):null}
function subStatus(s){ if(!s) return 'none'; const t=today(); if(s.start>t) return 'upcoming'; if(s.end<t) return 'expired'; const sl=subSessLeft(s); if(sl!==null&&sl<=0) return 'expired'; return (dBetween(t,s.end)<=7||(sl!==null&&sl<=2))?'ending':'active'; }
const sessTxt=s=>+s.sessions>0?`${subUsed(s)} من ${s.sessions}`:'مفتوح';
function chip(st){return {active:'<span class="chip ok">ساري</span>',ending:'<span class="chip warn">قرب يخلص</span>',expired:'<span class="chip bad">منتهي</span>',upcoming:'<span class="chip acc">لسه مبدأش</span>',none:'<span class="chip">مفيش اشتراك</span>'}[st]}

function table(id,heads,rows,{foot,copy=true,empty='مفيش بيانات لسه'}={}){
  const h=`<thead><tr>${heads.map(x=>`<th${x.startsWith('#')?' class="num"':''}>${esc(x.replace(/^#/,''))}</th>`).join('')}</tr></thead>`;
  const b=rows.length?`<tbody>${rows.join('')}</tbody>`:`<tbody><tr><td colspan="${heads.length}" class="empty">${empty}</td></tr></tbody>`;
  const f=foot&&rows.length?`<tfoot><tr>${foot.map(c=>`<td class="num">${c}</td>`).join('')}</tr></tfoot>`:'';
  return `<div class="tbl"><table id="${id}">${h}${b}${f}</table></div>`;

const UN_RE=/^[a-z0-9._-]{3,30}$/;
async function doLogin(e){
  e.preventDefault();
  const u=$('#lu').value.trim().toLowerCase(),p=$('#lp').value,b=$('#lbtn');
  if(!UN_RE.test(u)){$('#lerr').textContent='اسم المستخدم أو الباسورد غلط';return}
  b.disabled=true;$('#lerr').textContent='';
  try{await FB.login(u,p)}catch(err){$('#lerr').textContent=FB.msg(err);b.disabled=false}
}
async function doSetup(e){
  e.preventDefault();
  const g=$('#sg').value.trim(),n=$('#sn').value.trim(),u=$('#lu').value.trim().toLowerCase(),p=$('#sp').value,b=$('#lbtn');
  if(!g||!n) return $('#lerr').textContent='اكتب اسم الجيم واسمك';
  if(!UN_RE.test(u)) return $('#lerr').textContent='اسم المستخدم لازم يكون حروف إنجليزي صغيرة أو أرقام (3 حروف على الأقل)';
  if(p.length<6) return $('#lerr').textContent='الباسورد لازم يكون 6 حروف أو أكتر';
  b.disabled=true;$('#lerr').textContent='';
  try{await FB.setup(u,p,n,cfgOf(emptyDB(g)))}catch(err){$('#lerr').textContent=FB.msg(err);b.disabled=false}
}

function findMembers(q){
  q=q.trim().toLowerCase(); if(!q) return [];
  return visibleMembers().filter(m=>m.code===q||m.phone.includes(q)||m.code.startsWith(q)||m.name.toLowerCase().includes(q)).slice(0,8);
}
function liveSearch(){

}
function goSearch(){
  const q=$('#q').value.trim(); if(!q) return;
  const vm=visibleMembers();
  const exact=vm.find(m=>m.code===q||m.phone===q);
  if(exact) return go('member',exact.id);

  if(r.length===1) return go('member',r[0].id);
  if(!r.length) toast('مفيش مشترك بالكود أو الرقم ده');
}

function checkIn(mid){

    ${fld('تاريخ النهاية (بيتحسب لوحده)',`<input id="sf_end" readonly tabindex="-1">`)}
    ${fld('عدد الحصص (0 = مفتوح)',`<input type="number" min="0" name="sessions" id="sf_ses" value="${+v.sessions||0}"${lk}>`)}
    ${showMoney?fld('قيمة الاشتراك الإجمالية (ج.م)',`<input type="number" min="0" name="total" id="sf_total" value="${v.total}" required oninput="sfTot()"${lk}>`):''}
    ${free?'':'<p class="muted" id="sf_lock" style="grid-column:1/-1;margin:0">المدة والحصص والسعر بيتحددوا من الباقة تلقائي، وبيتغيّروا من الإعدادات بس.</p>'}
    ${!s&&can('payments','add')?fld('المدفوع دلوقتي (ج.م)',`<input type="number" min="0" name="paid" id="sf_paid" value="${v.total}" oninput="this.dataset.t=1;sfTot()">`)+fld('طريقة الدفع',`<select name="method">${opts(METHODS,'كاش')}</select>`)+`<p class="muted wide" id="sf_left" style="grid-column:1/-1;margin:0"></p>`:''}

const XL_COLS=[['code','الكود'],['name','الاسم'],['phone','الموبايل'],['activity','نوع التمرين'],['trainer','الكابتن'],['start','تاريخ البداية'],['months','المدة بالشهور'],['end','تاريخ النهاية'],['sessions','عدد الحصص'],['sleft','الحصص الباقية'],['paid','المدفوع'],['left','المتبقي'],['notes','ملاحظات']];

function xlDate(v,X){
  if(v==null||v==='') return '';
  if(v instanceof Date&&!isNaN(v)) return ymd(new Date(v.getTime()+12*3600e3));
  if(typeof v==='number'){const d=X.SSF.parse_date_code(v);return d?`${d.y}-${pad(d.m)}-${pad(d.d)}`:''}
  const m=String(v).trim().match(/^(\d{1,4})[\/\-.](\d{1,2})[\/\-.](\d{1,4})/);if(!m) return null;
  let [_,a,b,c]=m; if(a.length===4) return `${a}-${pad(+b)}-${pad(+c)}`; if(c.length===2) c='20'+c; return `${c}-${pad(+b)}-${pad(+a)}`;
}
const xlNum=v=>{if(v===''||v==null) return 0;const n=+String(v).replace(/[,\s٬]/g,'').replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d));return isNaN(n)?NaN:n};
let XL_ROWS=[];
async function xlRead(inp){
  const f=inp.files[0];inp.value='';if(!f) return;
  let X;try{X=await loadXLSX()}catch(e){return toast('مش قادر أحمّل أداة Excel — اتأكد من النت')}
  let rows;try{const wb=X.read(await f.arrayBuffer(),{type:'array',cellDates:true});rows=X.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:true,defval:''})}catch(e){return toast('الملف ده مش Excel سليم')}
  const hi=rows.findIndex(r=>r.some(c=>XL_ALIAS.name.includes(xlNorm(c))));
  if(hi<0) return toast('مش لاقي عمود "الاسم" في الملف — استخدم النموذج');
  const map={};rows[hi].forEach((c,i)=>{const n=xlNorm(c);for(const [k,al] of Object.entries(XL_ALIAS)) if(al.map(xlNorm).includes(n)&&map[k]==null) map[k]=i});
  if(map.phone==null) return toast('مش لاقي عمود "الموبايل" في الملف');
  const phones=new Set(DB.members.map(m=>m.phone)),codes=new Set(DB.members.map(m=>m.code)),fPh=new Set(),fCo=new Set();
  XL_ROWS=[];
  rows.slice(hi+1).forEach((r,k)=>{
    const g=key=>map[key]==null?'':r[map[key]];
    if(r.every(c=>String(c).trim()==='')) return;
    const o={line:hi+k+2,code:String(g('code')).trim(),name:String(g('name')).trim(),phone:String(g('phone')).replace(/\D/g,''),activity:String(g('activity')).trim(),trainer:String(g('trainer')).trim(),notes:String(g('notes')).trim()};
    if(/^1\d{9}$/.test(o.phone)) o.phone='0'+o.phone;
    o.start=xlDate(g('start'),X);o.end=xlDate(g('end'),X);o.months=xlNum(g('months'));o.paid=xlNum(g('paid'));o.left=xlNum(g('left'));const tot=xlNum(g('total'));o.ses=xlNum(g('sessions'));o.sleft=String(g('sleft')).trim()===''?null:xlNum(g('sleft'));
    const errs=[];
    if(/مثال/.test(o.notes)) errs.push('سطر المثال');
    if(!o.name) errs.push('الاسم ناقص');
    if(!o.phone) errs.push('الموبايل ناقص');
    else if(phones.has(o.phone)) errs.push('الرقم متسجل في السيستم');
    else if(fPh.has(o.phone)) errs.push('الرقم متكرر في الملف');
    if(o.code&&(codes.has(o.code)||fCo.has(o.code))) errs.push('الكود متكرر');
    if(o.start===null||o.end===null) errs.push('تاريخ مش مفهوم (اكتبه يوم/شهر/سنة)');
    if(isNaN(o.paid)||isNaN(o.left)||isNaN(o.months)||isNaN(tot)||isNaN(o.ses)||(o.sleft!==null&&isNaN(o.sleft))) errs.push('رقم مش مفهوم');
    if(!errs.length){ if(o.sleft!==null&&!(o.ses>0)) o.ses=o.sleft; if(o.ses>0&&o.sleft!==null&&o.sleft>o.ses) errs.push('الحصص الباقية أكبر من عدد الحصص'); o.usedBefore=o.ses>0&&o.sleft!==null?o.ses-o.sleft:0; }
    if(!errs.length){

      const cred = await createUserWithEmailAndPassword(auth, EMAIL(u), p);
      try {
        await setDoc(doc(db, "users", cred.user.uid), { name, username: u, roleId: "admin", trainerId: "", active: true, deleted: false });
      } catch (e) { await cred.user.delete().catch(() => {}); throw new Error("already-setup"); }
      await setDoc(doc(db, "secrets", cred.user.uid), { pw: p });
      await setDoc(doc(db, "data", "config"), cfg);
      settingUp = false; startSession(cred.user);
    } catch (e) { settingUp = false; if (auth.currentUser) await signOut(auth).catch(() => {}); throw e; }
  },
  async createUser(u, p) {
    const cred = await createUserWithEmailAndPassword(helper, EMAIL(u), p);
    const id = cred.user.uid; await signOut(helper).catch(() => {});
    await setDoc(doc(db, "secrets", id), { pw: p });
    return id;
  },
  async changePassword(id, u, p) {
    const s = await getDoc(doc(db, "secrets", id));
    if (!s.exists()) throw new Error("no-secret");
    const cred = await signInWithEmailAndPassword(helper, EMAIL(u), s.data().pw);
    await updatePassword(cred.user, p); await signOut(helper).catch(() => {});
    await setDoc(doc(db, "secrets", id), { pw: p });
  },
  saveUser: (id, d) => setDoc(doc(db, "users", id), d)
};

</script>
